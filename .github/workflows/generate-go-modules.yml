name: Generate Go Modules from Proto Files

on:
  # Trigger workflow when changes are pushed to the 'protobuf' branch,
  # specifically if .proto files within the 'proto/' directory (on that branch) are modified.
  push:
    branches:
      - protobuf # Name of your branch with .proto definitions
    paths:
      - 'proto/**' # Adjust if your .proto files are in a different directory on the 'protobuf' branch
      - .github/workflows/generate-go-modules.yml # Ensure the workflow file itself is included

  workflow_dispatch: # Allow manual triggering

  pull_request:
    branches: [protobuf]
    paths: ['proto/**', '.github/workflows/generate-go-modules.yml']

permissions:
  contents: read

concurrency:
  group: generated-go-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  generate-go-modules:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main # Checkout the main branch first, as we'll commit generated files here
          persist-credentials: false

      - name: Checkout protobuf branch for .proto files
        uses: actions/checkout@v4
        with:
          # Push and PR builds use their exact source/merge revision.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'protobuf' || github.sha }}
          path: temp_protobuf_checkout # Checkout into a temporary subdirectory
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/todofy/go.mod
          cache-dependency-path: go/todofy/go.sum

      - name: Record proto source revision
        id: source
        run: echo "sha=$(git -C temp_protobuf_checkout rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33 # Use a recent version
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3 # Use a recent version
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH # Add Go bin to PATH

      - name: Seed new newsletter module with tested Go runtime versions
        run: |
          if [ -f temp_protobuf_checkout/proto/newsletter/editorial.proto ] && [ ! -f go/newsletter/go.mod ]; then
            mkdir -p go/newsletter
            sed 's#^module github.com/ziyixi/protos/go/todofy$#module github.com/ziyixi/protos/go/newsletter#' go/todofy/go.mod > go/newsletter/go.mod
            cp go/todofy/go.sum go/newsletter/go.sum
          fi

      - name: Generate Go Modules
        run: |
          export MODULE_PREFIX="github.com/${{ github.repository }}"
          # PROTO_BASE_DIR_ENV: The root of the checkout where 'proto' subdir resides.
          # This will be used as the --proto_path for protoc.
          export PROTO_BASE_DIR_ENV="temp_protobuf_checkout"
          # PROTO_SUBDIR_NAME_ENV: The name of the directory containing .proto files, relative to PROTO_BASE_DIR_ENV.
          export PROTO_SUBDIR_NAME_ENV="proto"
          
          bash ./scripts/generate-go-proto.sh
        env:
          # GITHUB_REPOSITORY is in format owner/repo, MODULE_PREFIX needs the host.
          MODULE_PREFIX: github.com/${{ github.repository }}


      - name: Verify generated Go modules before publishing
        run: |
          set -euo pipefail
          while IFS= read -r -d '' module; do
            (
              cd "$(dirname "$module")"
              go mod verify
              go test ./...
              go vet ./...
              go build ./...
            )
          done < <(find go -name go.mod -print0)

      - uses: actions/upload-artifact@v4
        with:
          name: generated-go
          path: go/
          if-no-files-found: error

  publish-go:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/protobuf'
    needs: generate-go-modules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: generated-go
          path: go/
      - name: Commit and push the verified Go modules
        env:
          PROTO_SOURCE_SHA: ${{ needs.generate-go-modules.outputs.source-sha }}
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f go/
          if git diff --cached --quiet; then
            echo "Generated Go modules are unchanged."
            exit 0
          fi
          git commit -m "Generate Go modules from protobuf ${PROTO_SOURCE_SHA}"
          git push origin main
