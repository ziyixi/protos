syntax = "proto3";

package todofy;
option go_package = "github.com/ziyixi/protos/go/todofy";

enum ModelFamily {
  // The model family is unspecified.
  MODEL_FAMILY_UNSPECIFIED = 0;
  // The model family is Gemini.
  MODEL_FAMILY_GEMINI = 1;
}

enum Model {
  // Use the server's default model selection and fallback policy.
  MODEL_UNSPECIFIED = 0;
  // gemini-2.0-pro-exp-02-05
  MODEL_GEMINI_2_0_PRO_EXP_02_05 = 1 [deprecated = true];
  // gemini-1.5-pro
  MODEL_GEMINI_1_5_PRO = 2 [deprecated = true];
  // gemini-2.0-flash
  MODEL_GEMINI_2_0_FLASH = 3 [deprecated = true];
  // gemini-1.5-flash
  MODEL_GEMINI_1_5_FLASH = 4 [deprecated = true];
  // gemini-2.5-pro-exp-03-25
  MODEL_GEMINI_2_5_PRO_EXP_03_25 = 5 [deprecated = true];
  // gemini-2.5-flash-preview-04-17
  MODEL_GEMINI_2_5_FLASH_PREVIEW_04_17 = 6 [deprecated = true];
  // gemini-2.0-flash-lite
  MODEL_GEMINI_2_0_FLASH_LITE = 7 [deprecated = true];
  // Legacy project choices, retained for compatibility. Deprecation here does
  // not imply that Google has shut down these endpoints; prefer stable 3.x.
  // gemini-2.5-pro
  MODEL_GEMINI_2_5_PRO = 8 [deprecated = true];
  // gemini-2.5-flash
  MODEL_GEMINI_2_5_FLASH = 9 [deprecated = true];
  // gemini-2.5-flash-lite
  MODEL_GEMINI_2_5_FLASH_LITE = 10 [deprecated = true];
  // gemini-3-flash-preview
  MODEL_GEMINI_3_FLASH_PREVIEW = 11 [deprecated = true];

  // Text-generation endpoints verified on 2026-09-04. Never renumber values.
  // gemini-3.8-flash
  MODEL_GEMINI_3_8_FLASH = 12;
  // gemini-3.7-flash
  MODEL_GEMINI_3_7_FLASH = 13;
  // gemini-3.6-flash
  MODEL_GEMINI_3_6_FLASH = 14;
  // gemini-3.5-flash
  MODEL_GEMINI_3_5_FLASH = 15;
  // gemini-3.5-flash-lite
  MODEL_GEMINI_3_5_FLASH_LITE = 16;
  // gemini-3.1-flash-lite
  MODEL_GEMINI_3_1_FLASH_LITE = 17;
  // gemini-3.1-pro-preview (preview, not a stable production default)
  MODEL_GEMINI_3_1_PRO_PREVIEW = 18;
}

message LLMSummaryRequest {
  // model family
  ModelFamily model_family = 1;
  // The model to use. Unspecified lets the server choose and fall back;
  // an explicit model requests only that model.
  Model model = 2;
  // The prompt to summarize.
  string prompt = 3;
  // The maximum number of tokens to generate.
  int32 max_tokens = 4;
  // The text to summarize.
  string text = 5;
}

message LLMSummaryResponse {
  // The summary of the text.
  string summary = 1;
  // The model used for the request.
  Model model = 2;
}

// Service for summarizing text using large language models.
service LLMSummaryService {
  // Summarize the text using the specified model.
  rpc Summarize(LLMSummaryRequest) returns (LLMSummaryResponse);
}
