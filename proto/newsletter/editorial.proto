syntax = "proto3";

package newsletter.v1;
option go_package = "github.com/ziyixi/protos/go/newsletter;newsletterpb";

// One application service. Render is pure; the other methods own durable state.
service NewsletterService {
  rpc StartRun(StartRunRequest) returns (CollectionRun);
  rpc GetRun(GetRunRequest) returns (CollectionRun);
  rpc PutPacket(PutPacketRequest) returns (Packet);
  rpc ReadInbox(ReadInboxRequest) returns (ReadInboxResponse);
  rpc PrepareEdition(PrepareEditionRequest) returns (Edition);
  rpc GetEdition(GetEditionRequest) returns (Edition);
  rpc RenderEdition(RenderEditionRequest) returns (RenderedEdition);
  rpc SendEdition(SendEditionRequest) returns (Edition);
}

// External trigger only. Instructions are selected/snapshotted by the server,
// never supplied as paths or prompts by an HTTP caller. This never sends mail.
message StartRunRequest {
  string request_key = 1;
  string issue_date = 2;
}

message GetRunRequest {
  string id = 1;
}

message CollectionDirection {
  string id = 1;
  string instruction_hash = 2;
  string state = 3; // queued, collecting, collected, no_findings, failed.
  repeated string packet_ids = 4;
  string note = 5;
}

message CollectionRun {
  string id = 1;
  string issue_date = 2;
  string state = 3; // queued, collecting, projecting, editing, ready, blocked, failed.
  string instructions_hash = 4;
  repeated CollectionDirection directions = 5;
  string edition_id = 6;
  string error_code = 7;
  string created_at = 8;
  string updated_at = 9;
  bool is_fixture = 10;
  WorkflowProgress workflow = 11;
  UsageSummary usage = 12;
  PublicationSummary publication = 13;
}

// Discovery metadata is a lead, never a verified research packet.
message Candidate {
  string id = 1;
  string direction = 2;
  string title = 3;
  string url = 4;
  string doi = 5;
  string version = 6;
  string event_key = 7;
  string published_at = 8;
  string summary = 9;
  string why_now = 10;
  string access_scope = 11;
  string provenance = 12;
}

message ResearchTask {
  string id = 1;
  repeated string candidate_ids = 2;
  string question = 3;
  string why = 4;
  uint32 priority = 5;
  string evidence_context = 6;
  repeated string source_urls = 7;
}

message WorkflowNodeStatus {
  string id = 1;
  string type = 2;
  string state = 3;
  uint32 completed_items = 4;
  uint32 failed_items = 5;
  string error_code = 6;
}

message WorkflowProgress {
  string id = 1;
  string definition_hash = 2;
  string state = 3;
  repeated WorkflowNodeStatus nodes = 4;
  uint32 candidate_count = 5;
  uint32 research_count = 6;
  // Audited, separately frozen continuations; never rewrite the original graph.
  repeated WorkflowProgress continuations = 7;
}

// Provider counters, not an estimate of billed cost or context size. Cached input
// and reasoning output are subsets; do not add them to total a second time.
message TokenCounts {
  uint64 input_tokens = 1;
  uint64 cached_input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 reasoning_output_tokens = 4;
  uint64 total_tokens = 5;
}

message UsageSummary {
  TokenCounts usage = 1; // Absence means unavailable, never an observed zero.
  uint32 invocations = 2;
  uint32 missing_invocations = 3;
  bool partial = 4;
}

message Source {
  string id = 1;
  string title = 2;
  string url = 3;
  string excerpt = 4;
  // metadata, abstract, full_text, dataset. Access is reported, not certified.
  string access_scope = 5;
  string published_at = 6;
}

message PacketBody {
  string title = 1;
  string body = 2;
  repeated Source sources = 3;
  repeated string tags = 4;
}

message Packet {
  string id = 1;
  string workflow_id = 2;
  string producer_id = 3;
  string content_hash = 4;
  string created_at = 5;
  bool is_fixture = 6;
  PacketBody content = 7;
}

message PutPacketRequest {
  string request_key = 1;
  string workflow_id = 2;
  PacketBody content = 3;
}

message ReadInboxRequest {
  uint32 limit = 1;
  // Opaque server cursor; clients must not construct it or infer completion.
  string cursor = 2;
}

message ReadInboxResponse {
  repeated Packet packets = 1;
  string next_cursor = 2;
}

message Paragraph {
  string text = 1;
  // Each citation is packet_id/source_id; both identities are checked locally.
  repeated string citations = 2;
}

message Section {
  string kind = 1; // world, feature, context.
  string heading = 2;
  repeated Paragraph paragraphs = 3;
  string limitations = 4;
}

message ChartPoint {
  string label = 1;
  oneof observation {
    string decimal_value = 2; // Finite decimal string; never NaN/Infinity.
    string missing_reason = 3; // Missing is explicit, not an implicit zero.
  }
  repeated string citations = 4;
}

message Chart {
  string kind = 1; // bar, line.
  string question = 2;
  string metric = 3;
  string unit = 4;
  string period = 5;
  string caption = 6;
  string alt_text = 7;
  string limitations = 8;
  repeated ChartPoint points = 9;
}

message RecommendedReading {
  string citation = 1;
  string reason = 2;
  // The primary reading link stays singular; facts may need additional evidence.
  repeated string supporting_citations = 3;
}

// An independently reviewed, self-contained topic. Optional reading/chart parts
// may be withheld without removing the approved body or another topic.
message StoryContent {
  string story_id = 1;
  string title = 2;
  string kind = 3; // world, feature, context.
  repeated Paragraph paragraphs = 4;
  string limitations = 5;
  RecommendedReading recommended_reading = 6;
  Chart chart = 7;
}

message StoryCoverage {
  string story_id = 1;
  string title = 2;
  repeated string candidate_ids = 3;
  string disposition = 4; // deep, brief, watch, deferred.
  string reason = 5;
  uint32 priority = 6;
}

message PublicationSummary {
  string mode = 1; // complete, partial: delivery status is a separate concern.
  string reason = 2;
  repeated StoryCoverage stories = 3;
}

message Draft {
  string subject = 1;
  string title = 2;
  string introduction = 3;
  repeated Section sections = 4;
  Chart chart = 5;
  RecommendedReading recommended_reading = 6;
  string limitations = 7;
}

message Review {
  bool passed = 1;
  repeated string findings = 2;
}

message RenderEditionRequest {
  Draft draft = 1;
  repeated Packet packets = 2;
  string issue_date = 3;
  bool is_fixture = 4;
  PersonalDigest personal_digest = 5;
  UsageSummary usage = 6;
}

// Host-fetched private material: never part of an LLM draft or public-source packet.
message PersonalDigest {
  string state = 1; // current, empty, unavailable, disabled.
  string title = 2;
  string summary = 3;
  repeated PersonalEvent items = 4;
  optional uint32 task_count = 5; // Omitted means unknown, not zero.
  uint32 time_window_hours = 6;
  string fetched_at = 7;
  string source_label = 8;
  string limitations = 9;
  bool is_fixture = 10;
  string error_code = 11;
}

message PersonalEvent {
  uint32 rank = 1;
  string title = 2;
  string detail = 3;
}

message RenderedEdition {
  string html = 1;
  string text = 2;
  bytes chart_png = 3;
  string render_hash = 4;
}

message Edition {
  string id = 1;
  string issue_date = 2;
  string state = 3; // queued, running, ready, blocked, failed.
  repeated string packet_ids = 4;
  Draft draft = 5;
  Review review = 6;
  RenderedEdition rendered = 7;
  string delivery_state = 8;
  string provider_message_id = 9;
  string error_code = 10;
  string created_at = 11;
  string updated_at = 12;
  bool is_fixture = 13;
  PersonalDigest personal_digest = 14;
  UsageSummary usage = 15;
  PublicationSummary publication = 16;
}

message PrepareEditionRequest {
  string request_key = 1;
  string issue_date = 2;
  repeated string packet_ids = 3;
}

message GetEditionRequest {
  string id = 1;
}

message SendEditionRequest {
  string id = 1;
  string request_key = 2;
  string expected_render_hash = 3;
}
